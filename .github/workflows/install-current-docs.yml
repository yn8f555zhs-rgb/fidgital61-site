name: Install current federation documents

on:
  push:
    paths:
      - '.tmp/docs-upload/part24'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild and install current documents
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib, io, zipfile

          expected = '4d1b52ff4e221ed41b11c6f253a174c329d98fa1d3a509cc3f20144d5261623f'
          d = Path('.tmp/docs-upload')
          parts = [d / f'part{i:02d}' for i in range(1, 25)]
          missing = [str(p) for p in parts if not p.exists()]
          if missing:
              raise SystemExit('Missing chunks: ' + ', '.join(missing))

          encoded = ''.join(p.read_text(encoding='utf-8') for p in parts)
          payload = base64.b64decode(encoded, validate=True)
          actual = hashlib.sha256(payload).hexdigest()
          if actual != expected:
              raise SystemExit(f'Archive checksum mismatch: {actual} != {expected}')

          with zipfile.ZipFile(io.BytesIO(payload)) as z:
              z.extractall('.')
              print('Installed:')
              for name in z.namelist():
                  print(' -', name)

          for p in d.glob('part*'):
              p.unlink()
          (d / 'READY').unlink(missing_ok=True)
          try:
              d.rmdir()
          except OSError:
              pass
          PY

      - name: Commit installed documents
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Publish current federation documents"
            git push
          fi
