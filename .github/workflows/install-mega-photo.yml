name: Install Mega festival photo

on:
  push:
    paths:
      - '.tmp/newsphoto/READY'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build replacement photo
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, re, shutil

          parts = sorted(Path('.tmp/newsphoto').glob('good.part*'))
          if not parts:
              raise SystemExit('No photo parts found')
          payload = ''.join(p.read_text(encoding='utf-8') for p in parts)
          data = base64.b64decode(payload)

          out = Path('assets/news/mega-festival-digital-dance-2026.jpg')
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_bytes(data)

          page = Path('index.html')
          html = page.read_text(encoding='utf-8')
          html = re.sub(
              r'assets/news/mega-festival-digital-dance-2026\.jpg\?v=[^"\']+',
              'assets/news/mega-festival-digital-dance-2026.jpg?v=20260909-9',
              html
          )
          page.write_text(html, encoding='utf-8')

          shutil.rmtree('.tmp/newsphoto')
          PY
      - name: Commit replacement photo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Replace Mega festival photo with uploaded image"
          git push
