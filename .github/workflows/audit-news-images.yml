name: Audit news images
on:
  push:
    paths:
      - '.tmp/audit-news-images-v2'
permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Pillow
        run: python -m pip install --quiet pillow
      - name: Verify images actually used by news
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import re, sys
          html = Path("index.html").read_text(encoding="utf-8")
          block = re.search(r'<div class="cards news news-grid">(.*?)</div>\s*</div>\s*</section>', html, re.S).group(1)
          srcs = re.findall(r'<img[^>]+src="([^"]+)"', block)
          print("NEWS IMAGES:", len(srcs))
          bad = []
          for src in srcs:
              path = src.split("?",1)[0]
              p = Path(path)
              print("\n", path, "exists=", p.exists(), "bytes=", p.stat().st_size if p.exists() else 0)
              if not p.exists():
                  bad.append((path,"missing"))
                  continue
              if p.suffix.lower() == ".svg":
                  txt=p.read_text(encoding="utf-8")
                  ok=txt.lstrip().startswith("<svg")
                  print("SVG", "OK" if ok else "BROKEN")
                  if not ok: bad.append((path,"bad svg"))
                  continue
              try:
                  with Image.open(p) as im:
                      print("PIL", im.format, im.size, im.mode)
                      im.verify()
                  with Image.open(p) as im:
                      im.load()
                      print("LOAD OK")
              except Exception as e:
                  print("BROKEN", repr(e))
                  bad.append((path,str(e)))
          if bad:
              print("FAILED:", bad)
              sys.exit(1)
          print("\nALL REFERENCED NEWS IMAGES DECODE OK")
          PY
