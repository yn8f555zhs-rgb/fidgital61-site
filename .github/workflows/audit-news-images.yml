name: Audit news images
on:
  push:
    paths:
      - '.tmp/audit-news-images-v2'
permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Pillow
        run: python -m pip install --quiet pillow
      - name: Verify every news image
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import mimetypes
          for p in sorted(Path("assets/news").iterdir()):
              if not p.is_file():
                  continue
              print("\nFILE", p, "bytes=", p.stat().st_size)
              print("MIME", mimetypes.guess_type(p.name)[0])
              try:
                  with Image.open(p) as im:
                      print("PIL", im.format, im.size, im.mode)
                      im.verify()
                  with Image.open(p) as im:
                      im.load()
                      print("LOAD OK")
              except Exception as e:
                  print("BROKEN", type(e).__name__, str(e))
          PY
