name: Repair broken news images
on:
  push:
    paths:
      - '.tmp/repair-broken-news-images-v1'
permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Pillow
        run: python -m pip install --quiet pillow
      - name: Repair images
        run: |
          python - <<'PY'
          from pathlib import Path
          from io import BytesIO
          from urllib.request import Request, urlopen
          from PIL import Image, ImageFile

          Path("assets/news").mkdir(parents=True, exist_ok=True)

          # Championship Russia 2026 — official DSTU news image.
          url = "https://news.donstu.ru/upload/iblock/e26/2w86cmf1md87dzkrxalzf8ygkxo8nw9v.png"
          req = Request(url, headers={"User-Agent":"Mozilla/5.0"})
          data = urlopen(req, timeout=30).read()
          im = Image.open(BytesIO(data)).convert("RGB")
          im.thumbnail((1000, 1000))
          im.save("assets/news/championship-russia-2026-rostov.webp", "WEBP", quality=82, method=6)

          # Mega photo — recover the existing truncated JPEG and re-encode it.
          ImageFile.LOAD_TRUNCATED_IMAGES = True
          src = Path("assets/news/mega-festival-digital-dance-2026.jpg")
          with Image.open(src) as im:
              im = im.convert("RGB")
              im.thumbnail((1000, 1000))
              im.save("assets/news/mega-festival-digital-dance-2026.webp", "WEBP", quality=82, method=6)

          # Verify newly written files really decode.
          for p in [
              Path("assets/news/championship-russia-2026-rostov.webp"),
              Path("assets/news/mega-festival-digital-dance-2026.webp"),
          ]:
              with Image.open(p) as im:
                  im.verify()
              with Image.open(p) as im:
                  im.load()
                  print(p, im.format, im.size, "OK")
          PY
      - name: Commit repaired images
        run: |
          git config user.name "ffsro-site-bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/news/championship-russia-2026-rostov.webp assets/news/mega-festival-digital-dance-2026.webp
          git commit -m "Repair broken news images"
          git push
